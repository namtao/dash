<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <script>/* iOS phóng to khi focus ô nhập chữ <16px; maximum-scale=1 tắt việc đó, iOS vẫn cho pinch zoom */ if (/iP(hone|ad|od)/.test(navigator.platform) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform))) document.querySelector("meta[name=viewport]").content += ", maximum-scale=1";</script>
    <title>Dash</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#21252b" />
    <link rel="icon" href="/icon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #282c34; }
      html.light, html.light body { background: #fff; }
      /* Liquid glass: khung ngoài lót cùng ảnh nền (bản thu nhỏ) để lúc mở / chuyển tab dự án không nháy màu khác */
      html.glass, html.glass body { background: var(--bg-thumb, none) center / cover no-repeat, #0c0c0e; }
      html.glass.light, html.glass.light body { background-color: #e9ecf2; }
      /* --vvh: chiều cao phần còn thấy khi bàn phím ảo mở (shell.js), để terminal / ô nhập Claude không bị che */
      iframe { position: fixed; inset: 0; width: 100%; height: var(--vvh, 100%); border: 0; display: block; }
      iframe.hidden { display: none; }
    </style>
    <script>
      try {
        const h = document.documentElement;
        if (JSON.parse(localStorage.getItem("dash:theme") || '"dark"') !== "dark") h.classList.add("light");
        if (localStorage.getItem("dash:glass") === "1") {
          h.classList.add("glass");
          const th = localStorage.getItem("dash:bgThumb");
          if (th && localStorage.getItem("dash:bgThumbSrc") === localStorage.getItem("dash:bg")) h.style.setProperty("--bg-thumb", `url(${JSON.stringify(th)})`);
        }
      } catch {}
    </script>
  </head>
  <body>
    <script src="/js/shell.js"></script>
  </body>
</html>
