<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dash</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e2227" />
    <link rel="icon" href="/icon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #23272e; }
      html.light, html.light body { background: #fff; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
      iframe.hidden { display: none; }
    </style>
    <script>
      try {
        if (JSON.parse(localStorage.getItem("dash:theme") || '"dark"') !== "dark") document.documentElement.classList.add("light");
      } catch {}
    </script>
  </head>
  <body>
    <script src="/js/shell.js"></script>
  </body>
</html>
